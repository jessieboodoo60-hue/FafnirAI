<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fafnir</title>
<link rel="stylesheet" href="desktop.css">
</head>
<body>
  <!-- wallpaper: a painted dusk ridge (or the owner's own picture) -->
  <div id="wallpaper"><div class="sun"></div>
    <svg class="ridges" viewBox="0 0 1600 560" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path fill="var(--r1)" d="M0 250 C120 228 210 172 330 186 C430 198 470 150 560 128 C640 110 700 160 790 170 C880 180 930 120 1030 104 C1130 90 1190 150 1290 160 C1390 170 1460 128 1600 140 L1600 560 L0 560Z"/>
      <path fill="var(--r2)" d="M0 330 C90 312 180 262 290 272 C390 282 450 240 540 236 C640 232 690 286 800 290 C900 294 980 236 1090 226 C1190 218 1250 276 1350 284 C1450 292 1520 262 1600 256 L1600 560 L0 560Z"/>
      <path fill="var(--r3)" d="M0 410 C110 388 200 350 320 360 C430 370 500 330 610 336 C720 342 780 392 900 394 C1010 396 1080 350 1190 346 C1300 342 1370 392 1480 396 C1530 398 1570 386 1600 380 L1600 560 L0 560Z"/>
      <path fill="var(--r4)" d="M0 480 C140 462 260 440 400 452 C540 464 640 432 780 438 C920 444 1010 480 1150 476 C1290 472 1400 446 1600 456 L1600 560 L0 560Z"/>
    </svg>
    <div class="grain"></div></div>

  <!-- top menu bar -->
  <header id="menubar" class="glass bar">
    <div class="left">
      <button class="mb-item logo" data-menu="fafnir" title="Fafnir"></button>
      <button class="mb-item app-name" data-menu="app" id="mb-app">Fafnir</button>
      <button class="mb-item" data-menu="file">File</button>
      <button class="mb-item" data-menu="window">Window</button>
      <button class="mb-item" data-menu="help">Help</button>
    </div>
    <div class="right">
      <div class="mb-status" id="mb-status"><span class="dot"></span><span id="mb-status-text">Ready</span></div>
      <button class="mb-icon" id="mb-search" title="Search (Ctrl+Space)"></button>
      <button class="mb-icon" id="mb-control" title="Control Centre"></button>
      <button class="mb-icon" id="mb-bell" title="Notices"><span class="badge" id="mb-badge"></span></button>
      <button class="mb-clock" id="mb-clock"></button>
    </div>
  </header>

  <!-- desktop surface: icons, the Right-now widget and windows live here -->
  <main id="desktop">
    <section id="widget-now" class="glass widget">
      <div class="w-kicker">Right now</div>
      <div class="w-briefing" id="now-briefing">Getting your day ready…</div>
      <ul class="w-items" id="now-items"></ul>
    </section>
    <div id="icons"></div>
    <div id="windows"></div>
  </main>

  <!-- dock -->
  <nav id="dock-wrap"><div id="dock" class="glass"></div></nav>

  <!-- overlays -->
  <div id="banners"></div>
  <div id="menu-layer"></div>
  <div id="search" class="overlay hidden">
    <div class="search-box glass">
      <div class="search-row"><span class="search-glyph"></span><input id="search-input" placeholder="Search apps, files, notes, memory… or ask Fafnir" autocomplete="off"></div>
      <div id="search-results"></div>
    </div>
  </div>
  <div id="control" class="glass popover hidden"></div>
  <div id="confirm" class="overlay hidden">
    <div class="sheet glass">
      <div class="sheet-kicker">Fafnir needs your OK</div>
      <div class="sheet-text" id="confirm-text"></div>
      <pre class="sheet-detail" id="confirm-detail"></pre>
      <div class="sheet-hint" id="confirm-hint"></div>
      <div class="sheet-buttons"><button class="btn" id="confirm-no">No</button><button class="btn primary" id="confirm-yes">Yes, do it</button></div>
    </div>
  </div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="icons.js"></script>
  <script src="desktop.js"></script>
  <script src="apps.js"></script>
</body>
</html>
