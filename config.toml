# Fafnir configuration. Tune here, not in code.

[assistant]
name = "Fafnir"
purpose = "help the owner run their business, their social media, and their computer"
tone = "crisp and professional: brief, direct, no filler"
# Where the owner usually is. Used for weather, local time and "near me" questions.
home_location = "Petit Valley, Diego Martin, Trinidad and Tobago"

[model]
# claude-sonnet-5-5 ($2/$10 per million tokens) is the everyday choice.
# claude-opus-5-5 ($4/$20) is smarter on hard problems; claude-haiku-5-5 ($0.10/$0.50) is far cheaper but less capable.
name = "claude-sonnet-5-5"
# Where the brain runs: "api" uses Anthropic API credit (pay per token);
# "claude_code" uses your Claude subscription through the installed Claude Code app.
provider = "ollama"
# "ollama" runs the brain on this PC (private, free). Settings are under [model.local] below.
# With "ollama", the cloud brain named here is only used when you say yes to a hand-off.
cloud_provider = "claude_code"
max_tokens = 16000
# low | medium | high | xhigh | max. Lower = faster and cheaper; raise for harder work.
effort = "medium"
# Show what each reply cost and how much was served from the cache.
show_cost = true
# Server-side fallback if the model declines a request (on by default for this model).
fallbacks = true
# SDK retries on rate limits, overloads and network errors.
max_retries = 3
timeout_seconds = 120

[model.local]
# The local brain, served by Ollama (used when provider = "ollama").
name = "qwen3:8b"
# Context window. 4096 is what fits your 8 GB card at full speed (52-73 tokens/s measured);
# bigger overflows into normal memory and drops to ~7 tokens/s.
num_ctx = 4096
# How many tools the model is offered per request (the router picks the most relevant).
max_tools = 10
# When a request needs pictures, web search or a long multi-step job:
# "ask" = ask you each time before sending it to the cloud brain; "never" = stay local.
cloud_fallback = "ask"
keep_alive = "30m"
# The smaller, faster model the Balanced profile uses (fits beside OBS and other apps).
fast = "qwen3:4b-instruct"

[performance]
# What Fafnir may keep on the graphics card. "auto" decides by itself:
#   gaming         - a game is running: local models unloaded, voice made on the processor
#   balanced       - the 4B model + voice on the card
#   ai_performance - the 8B model + voice on the card (needs ~6 GB of graphics memory free)
# Or fix one: "gaming", "balanced", "ai_performance". You can also just tell Fafnir "gaming mode".
profile = "auto"
# In Gaming the local brain is unloaded. What to do with requests then:
# "ask" = ask you before sending each one to the cloud brain; "cloud" = send without asking; "off" = decline.
gaming_brain = "ask"
# Extra program names to treat as games / never treat as games (games in Steam, Epic, Riot,
# Xbox, Ubisoft, GOG, EA, Battle.net and Rockstar folders are found automatically).
games = []
not_games = []

[tools]
# Your private documents (passport, IDs). Kept as one encrypted file in this folder; Fafnir
# must ask you before every unlock, and locks it again after 5 minutes at most.
private_folder = "C:/Personal Information"
# Folder of Markdown/text notes that notes_search looks through. "~" = your home folder.
notes_folder = "~/OneDrive/Documents"
# Web search and page fetching (run by Anthropic; billed per search).
web = true
web_max_uses = 5
# Google Calendar + Gmail. Needs data/google_credentials.json (a Google Cloud "Desktop app"
# OAuth client); the first use opens a browser to approve access.
google = true

[app]
# Desktop app (python main.py --app). Which monitor to fill: "right", "left" or "above"
# (relative to your main monitor), "primary", or a name like "DISPLAY2".
screen = "right"
fullscreen = true
# What the talk key is called on your keyboard (shown on screen).
talk_key_label = "M5"
# Background: "" = the built-in aurora, or a path to your own image (e.g. "C:/Users/jessi/Pictures/wall.jpg").
background = ""
# Which screen: "desktop" = the liquid-glass desktop (menu bar, dock, windows, search, files),
# "glass" = the simpler panel screen.
ui = "desktop"

[phone]
# Reach you on WhatsApp through the official WhatsApp Business Cloud API (Meta).
# Secrets go in .env: WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_APP_SECRET,
# WHATSAPP_OWNER_NUMBER (your number with country code, digits only).
enabled = true
# Which notices to send: "important" (the ones Fafnir says out loud), "urgent", or "all".
send = "important"
# Your free ngrok static domain (from dashboard.ngrok.com/domains), e.g. "calm-fox-123.ngrok-free.app".
# Fafnir starts the tunnel itself so Meta can deliver your messages to this PC.
ngrok_domain = "germless-arrange-plating.ngrok-free.dev"
start_tunnel = true
port = 8787
graph_version = "v23.0"
# Approved message template for alerts when you haven't messaged Fafnir in 24 hours
# (WhatsApp's rule). Create a Utility template with one body variable, e.g. "Fafnir: {{1}}".
alert_template = ""
template_language = "en_US"

[heartbeat]
# Background checks that let Fafnir reach out first. Notices appear in the app's Notices
# panel; "important" ones are also spoken. Pause any time: say "don't disturb me" or click
# the heartbeat button in the app. Set enabled = false under a check to turn it off.
# Spoken announcements are muted during quiet hours (e.g. "23:00-07:00"); "" = never muted.
quiet_hours = ""

[heartbeat.calendar]
every_minutes = 5
lead_minutes = 15        # warn this long before an event starts

[heartbeat.tasks]
every_minutes = 30       # business tracker + Google Tasks due today or overdue

[heartbeat.email]
every_minutes = 10
query = "is:unread is:important newer_than:2d"   # Gmail search for mail worth a notice
vip_senders = []         # e.g. ["andre@example.com", "@client.com"]: these are spoken aloud

[heartbeat.disk]
every_minutes = 360
min_free_gb = 20

[heartbeat.backup]
every_minutes = 1440     # once a day: zips data\, .env and config.toml
folder = "D:/FafnirBackups"
keep = 14                # newest copies kept

[heartbeat.youtube]
every_minutes = 60
videos = 3               # watch comments on this many of your latest videos

[voice]
# Key to hold while talking. Run `python main.py --learn-key` and press the key
# to see its code. Accepts a name ("ctrl_r", "f13"), a single character, or "vk:<number>".
ptt_key = "f13"
# Microphones in order of preference (part of the name is enough). Fafnir uses the first one
# that's plugged in and switches by itself when you connect or unplug one. Empty = Windows default.
mic_preference = ["Primus Headset", "USB 2.0 Camera"]
# Outputs that are headphones (part of the name). On any other output (the JBL), the mic can
# hear Fafnir, so it doesn't listen for its name while talking and ignores echoes of itself.
headphones = ["Primus"]
# Clean up the mic (WebRTC noise suppression + low-cut) before listening for the wake word.
noise_suppression = true
# Short beeps when recording starts and when Fafnir has heard you.
cue_sounds = true
# On headphones (see `headphones` below), just start talking to cut Fafnir off mid-sentence.
barge_in = true
# Print how long each stage took (transcribe, first audio).
show_timings = true

[voice.wake]
# Say "Fafnir" instead of holding the talk key (the key still works). Runs entirely on
# this PC by matching against recordings of your voice. Record them once with:
#   .venv\Scripts\python main.py --train-wake
enabled = true
# "whisper" = a small offline speech recognizer listens for the name (works for any voice);
# "samples" = matches recordings of your voice (python main.py --train-wake).
engine = "whisper"
sensitivity = 0.4            # 0-1: higher wakes more easily but false-triggers more
end_silence_seconds = 0.8    # how long a pause means you've finished talking
while_speaking = true        # say the wake word to cut Fafnir off mid-sentence
# Conversation mode: after each reply Fafnir keeps listening this many seconds, so you can
# just carry on talking (no wake word); every exchange renews it. Noise doesn't end it, talk
# that isn't meant for Fafnir is ignored, and "thanks, that's all" / "goodbye" ends it.
# A soft falling tone means it has stopped listening. 0 turns it off.
follow_up_seconds = 12

[voice.stt]
# Speech-to-text. "local" = Whisper on this PC (private; ~3.9% word errors, about 1 s, partly hidden
# in your closing pause). "deepgram" = Deepgram's cloud (2.4% word errors, 0.13 s; needs the API key).
engine = "local"
local_model = "small.en"     # "tiny.en" is 5x faster but makes about twice as many mistakes
# Deepgram settings (used only when engine = "deepgram")
model = "nova-3"
language = "en"

[voice.tts]
# Fafnir's voice. "kokoro" = made on this PC (free, no key); "elevenlabs" = ElevenLabs API.
engine = "kokoro"
# Kokoro: a voice name (am_onyx, bm_george, am_fenrir, ...) or a blend like "am_onyx+bm_george",
# pitch in semitones (negative = deeper), speed (1.0 normal), reverb (0 = none, 0.5 = cave-like).
kokoro_voice = "am_onyx"
kokoro_pitch = -3.0
kokoro_speed = 1.0
kokoro_reverb = 0.0
kokoro_lang = "en-us"
# ElevenLabs (only used if engine = "elevenlabs")
voice_id = "43vS2JKzejLgSwmqF6gC"
# eleven_flash_v2_5 = lowest latency; eleven_multilingual_v2 = richest quality, slower.
model = "eleven_flash_v2_5"

# Which mic to use for the speaker Windows is playing through (part of each name is enough).
# Checked first; if no rule matches, or its mic isn't plugged in, mic_preference above is used.
[voice.mic_for_speaker]
"Primus" = "Primus Headset"
"JBL" = "USB 2.0 Camera"
